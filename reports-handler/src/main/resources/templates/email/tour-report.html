<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
</head>

<body style="margin:0;padding:0;background:#f4f6f8;font-family:Arial,sans-serif;">
<p style="font-weight: bold; color: #555555; margin-bottom: 20px;">
    The report CSV file is attached below.
</p>
<div style="max-width:100%;margin:20px auto;background:#ffffff;border-radius:10px;overflow:hidden;">

    <!-- HEADER -->
    <div style="background:#1f3c88;color:white;padding:20px;">
        <h2 style="margin:0;">Weekly Tour Performance Report</h2>
        <p style="margin:5px 0 0;">Generated automatically</p>
    </div>

    <!-- TABLE -->
    <div style="overflow-x:auto;">
        <table style="min-width:100%;">
            <thead>
            <tr style="background:#3498db;color:white;">
                <th th:each="column : ${columns}"
                    style="padding:10px;text-align:center"
                    th:text="${column}">
                </th>
            </tr>
            </thead>

            <tbody>
            <tr th:each="r : ${reports}">

                <td style="text-align:center" th:text="${r.tourName}"></td>
                <td style="text-align:center" th:text="${r.destinationCountry}"></td>
                <td style="text-align:center" th:text="${r.destinationCity}"></td>
                <td style="text-align:center" th:text="${r.getReportStartDate()}"></td>
                <td style="text-align:center" th:text="${r.getReportEndDate()}"></td>
                <td style="text-align:center" th:text="${r.getToursSold()}"></td>
                <td style="text-align:center" th:text="${#numbers.formatDecimal(r.getTourSoldDelta(), 1, 2)}"></td>
                <td style="text-align:center" th:text="${#numbers.formatDecimal(r.getFeedbackRateAvg(), 1, 2)}"></td>
                <td style="text-align:center" th:text="${r.getFeedbackRateMin()}"></td>
                <td style="text-align:center" th:text="${#numbers.formatDecimal(r.getFeedbackRateAvgDelta(), 1, 2)}"></td>
                <td style="text-align:center" th:text="${r.getFinishedToursRevenue()}"></td>
                <td style="text-align:center" th:text="${#numbers.formatDecimal(r.getFinishedToursRevenueDelta(), 1, 2)}"></td>
            </tr>
            </tbody>

        </table>

    </div>

    <!-- FOOTER -->
    <div style="padding:15px;text-align:center;font-size:12px;color:#888;background:#f0f0f0;">
        © Report System
    </div>

</div>

</body>
</html>
