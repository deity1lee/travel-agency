# Default values for api-handler.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1

image:
  repository: api-handler
  pullPolicy: IfNotPresent
  # -- Overrides the image tag whose default is the chart appVersion.
  tag: ""

imagePullSecrets:
# Define secret to pull images. Secret can be provisioned by edp-install or manually.
  - name: regcred
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # -- Specifies whether a service account should be created
  create: true
  # -- Automatically mount a ServiceAccount's API credentials?
  automount: true
  # -- Annotations to add to the service account
  annotations: {}
  # -- The name of the service account to use. If not set and create is true, a name is generated using the fullname template
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext: {}
  # fsGroup: 2000

securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

service:
  type: ClusterIP
  port: 8080

ingress:
  enabled: true
  dnsWildcard: development.krci-dev.cloudmentor.academy
  className: ""
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  hosts:
    # If need to use specific host, define host value below. By default when set 'edpDefault' FQDN: <CODEBASE_NAME>-<CODEBASE_NAMESPACE>.<CLUSTER_DNS_WILDCARD>
    - host: edpDefault
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []
  #  - secretName: chart-example-tls
  #    hosts:
  #      - chart-example.local

resources: {}
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

livenessProbe:
  httpGet:
    path: /api/hello                   # The URL endpoint used to check the "liveness" of the container.
    port: http
  initialDelaySeconds: 30     # Delay (in seconds) before the first check after container start.
  periodSeconds: 5            # Time interval (in seconds) between successive checks.
  failureThreshold: 3         # Consecutive failures before the container is deemed unhealthy

readinessProbe:
  httpGet:
    path: /api/hello
    port: http
  initialDelaySeconds: 30
  periodSeconds: 5
  failureThreshold: 3

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

# Additional volumes on the output Deployment definition.
volumes: []
# - name: foo
#   secret:
#     secretName: mysecret
#     optional: false

# Additional volumeMounts on the output Deployment definition.
volumeMounts: []
# - name: foo
#   mountPath: "/etc/foo"
#   readOnly: true

# -- https://kubernetes.io/docs/concepts/scheduling-eviction/assign-pod-node/#nodeselector
nodeSelector: {}

# -- https://kubernetes.io/docs/concepts/scheduling-eviction/taint-and-toleration/
tolerations: []

# -- https://kubernetes.io/docs/concepts/scheduling-eviction/assign-pod-node/#affinity-and-anti-affinity
affinity: {}

env:
  extraEnv:
    - name: AWS_ACCESS_KEY_ID
      valueFrom:
        secretKeyRef:
          name: run24team7-secret
          key: aws-access-key-id
    - name: AWS_SECRET_ACCESS_KEY
      valueFrom:
        secretKeyRef:
          name: run24team7-secret
          key: aws-secret-access-key
    - name: AWS_SESSION_TOKEN
      valueFrom:
        secretKeyRef:
          name: run24team7-secret
          key: aws-session-token
    - name: SENDGRID_EMAIL
      valueFrom:
        secretKeyRef:
          name: run24team7-secret
          key: sendgrid-email
    - name: SENDGRID_API_KEY
      valueFrom:
        secretKeyRef:
          name: run24team7-secret
          key: sendgrid-api-key
    - name: APP_CAPTCHA_API_KEY
      valueFrom:
        secretKeyRef:
          name: run24team7-secret
          key: app-captcha-api-key
    - name: APP_CAPTCHA_ENABLE
      valueFrom:
        secretKeyRef:
          name: run24team7-secret
          key: app-captcha-enable
    - name: GOOGLE_CLIENT_ID
      valueFrom:
        secretKeyRef:
          name: run24team7-secret
          key: google-client-id
    - name: GOOGLE_CLIENT_SECRET
      valueFrom:
        secretKeyRef:
          name: run24team7-secret
          key: google-client-secret
    - name: DIAL_API_KEY
      valueFrom:
        secretKeyRef:
          name: run24team7-secret
          key: dial-api-key
    - name: REPORTS_HANDLER_URL
      valueFrom:
        secretKeyRef:
          name: run24team7-secret
          key: reports-handler-url
    - name: MONGODB_URI
      valueFrom:
        secretKeyRef:
          name: run24team7-secret
          key: mongodb-uri
    - name: ALLOWED_ORIGINS
      valueFrom:
        secretKeyRef:
          name: run24team7-secret
          key: allowed-origins
    - name: EMAIL_VERIFICATION_ENABLE
      valueFrom:
        secretKeyRef:
          name: run24team7-secret
          key: email-verification-enable
    - name: MONGO_URI
      valueFrom:
        secretKeyRef:
          name: run24team7-secret
          key: mongo-uri
